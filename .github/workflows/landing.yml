name: Landing CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing/dist

      # Deploys slicepilot.eu (Workers static assets, project "slicepilot-landing").
      # Repository secrets (Settings -> Secrets and variables -> Actions):
      #   CLOUDFLARE_API_TOKEN  Cloudflare API token (Workers Scripts Edit + Zone DNS Edit)
      #   CLOUDFLARE_ACCOUNT_ID Cloudflare account id
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageJSON: landing/package.json
          command: deploy --config landing/wrangler.jsonc
