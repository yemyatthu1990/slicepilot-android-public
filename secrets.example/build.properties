# Build-time configuration injected into BuildConfig by Gradle.
# Values are environment-specific; provide real values in secrets/build.properties.
CLOUD_GATEWAY_GLOBAL=https://gateway.example.com
CLOUD_GATEWAY_CHINA=https://gateway.example.cn
CLOUD_LOGIN_URL_GLOBAL=https://accounts.example.com/login
CLOUD_LOGIN_URL_CHINA=https://accounts.example.cn/login
CLOUD_COOKIE_DOMAINS=https://accounts.example.com,https://www.example.com
CLOUD_CLIENT_ID=CHANGE_ME
CLOUD_OAUTH_CLIENT_ID=CHANGE_ME
# PEM public key on a single line, newlines escaped as \n
CLOUD_RSA_PUBLIC_KEY=-----BEGIN PUBLIC KEY-----\nBASE64DATA\n-----END PUBLIC KEY-----
AGORA_APP_ID=CHANGE_ME
